name: Testar To-Do-List
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/js/script.js
      - run: node --test tests/tasks.test.cjs
